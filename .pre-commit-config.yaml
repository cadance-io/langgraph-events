default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^(\.secrets\.baseline|\.worktrees/|\.claude/)'

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        language: system
        entry: bash -c 'uv export --no-hashes --no-dev --format requirements-txt | uv run --with pip-audit pip-audit -r /dev/stdin'
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: validate-tests
        name: validate tests
        entry: bash -c "uv run python scripts/validate_tests.py"
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy src/ tests/test_event_typing.py tests/test_fold_reducer_typing.py
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: jscpd
        name: jscpd
        language: system
        # Version pinned and --max-size explicit on purpose. jscpd defaulted
        # --max-size to 100kb for years, which silently skipped test_agui.py,
        # test_event_graph.py and test_serde.py -- the three files that carried
        # ~89% of the duplication -- so this gate reported ~4% while the real
        # figure was 11.6%. A bare `npx jscpd` also re-resolves to whatever
        # version is newest, so the gate could change behaviour with no commit.
        # Skipped files are not reported, so the failure mode is silent: keep
        # --max-size comfortably above the largest file under src/ and tests/.
        entry: npx jscpd@5.0.16 src/ tests/ --min-tokens 30 --min-lines 2 --threshold 5 --max-size 5mb
        types: [python]
        pass_filenames: false
        require_serial: true
        files: ^(src/|tests/)

      - id: mermaid-graphs
        name: mermaid-graphs
        language: system
        entry: uv run python scripts/generate_mermaid.py
        pass_filenames: false
        require_serial: true
        files: ^examples/.*\.py$

      - id: pytest
        name: pytest
        language: system
        entry: bash -c 'uv run coverage run -m pytest && uv run coverage report'
        types: [python]
        pass_filenames: false
        require_serial: true
        files: ^(src/|tests/)
